name: Feature App

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.3'

      - name: Name feature app
        run: |
          slug="${GITHUB_REF_NAME#feature/}"
          bundle_suffix="$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
          display_slug="$(printf '%s' "$slug" | tr '-' ' ')"
          echo "FEATURE_SLUG=$slug" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=com.typewhisper.mac.dev.$bundle_suffix" >> "$GITHUB_ENV"
          echo "DISPLAY_NAME=TypeWhisper Feature - $display_slug" >> "$GITHUB_ENV"
          echo "APP_NAME=TypeWhisper-$slug" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project TypeWhisper.xcodeproj -scheme TypeWhisper

      - name: Build isolated feature app
        run: |
          xcodebuild build \
            -project TypeWhisper.xcodeproj \
            -scheme TypeWhisper \
            -configuration Debug \
            -derivedDataPath build-feature \
            -destination 'generic/platform=macOS' \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            TYPEWHISPER_DISPLAY_NAME="$DISPLAY_NAME" \
            TYPEWHISPER_FEATURE_SLUG="$FEATURE_SLUG" \
            TYPEWHISPER_ICLOUD_ENABLED=NO \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild build \
            -project TypeWhisper.xcodeproj \
            -scheme OpenAIPlugin \
            -configuration Debug \
            -derivedDataPath build-feature \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          mv build-feature/Build/Products/Debug/TypeWhisper.app "build-feature/Build/Products/Debug/$APP_NAME.app"
          ditto \
            build-feature/Build/Products/Debug/OpenAIPlugin.bundle \
            "build-feature/Build/Products/Debug/$APP_NAME.app/Contents/PlugIns/OpenAIPlugin.bundle"
          printf 'branch=%s\ncommit=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            > "build-feature/Build/Products/Debug/$APP_NAME.app/Contents/Resources/FeatureBuildSource.txt"
          ditto -c -k --keepParent \
            "build-feature/Build/Products/Debug/$APP_NAME.app" \
            "build-feature/$APP_NAME.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}
          path: build-feature/${{ env.APP_NAME }}.zip
          retention-days: 14
