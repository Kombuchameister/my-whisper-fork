name: Feature App

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.3'

      - name: Name feature app
        run: |
          slug="${GITHUB_REF_NAME##*/}"
          bundle_suffix="$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
          display_slug="$(printf '%s' "$slug" | tr '-' ' ')"
          echo "FEATURE_SLUG=$slug" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=com.typewhisper.mac.dev.$bundle_suffix" >> "$GITHUB_ENV"
          echo "DISPLAY_NAME=TypeWhisper Feature - $display_slug" >> "$GITHUB_ENV"
          echo "APP_NAME=TypeWhisper-$slug" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project TypeWhisper.xcodeproj -scheme TypeWhisper

      - name: Build isolated feature app
        run: |
          xcodebuild build \
            -project TypeWhisper.xcodeproj \
            -scheme TypeWhisper \
            -configuration Debug \
            -derivedDataPath build-feature \
            -destination 'generic/platform=macOS' \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            TYPEWHISPER_DISPLAY_NAME="$DISPLAY_NAME" \
            TYPEWHISPER_FEATURE_SLUG="$FEATURE_SLUG" \
            TYPEWHISPER_ICLOUD_ENABLED=NO \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          for plugin in \
            OpenAIPlugin GroqPlugin GeminiPlugin XAIPlugin ClaudePlugin \
            CerebrasPlugin FireworksPlugin MistralAIPlugin OpenRouterPlugin \
            OpenAICompatiblePlugin
          do
            xcodebuild build \
              -project TypeWhisper.xcodeproj \
              -target "$plugin" \
              -configuration Debug \
              SYMROOT="$PWD/build-feature/Build/Products" \
              OBJROOT="$PWD/build-feature/Build/Intermediates.noindex" \
              CODE_SIGN_IDENTITY='-' \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Package app
        run: |
          staging="build-feature/$APP_NAME-artifact"
          mkdir -p "$staging/BranchBuiltPlugins"
          mv build-feature/Build/Products/Debug/TypeWhisper.app "$staging/$APP_NAME.app"
          for plugin in \
            OpenAIPlugin GroqPlugin GeminiPlugin XAIPlugin ClaudePlugin \
            CerebrasPlugin FireworksPlugin MistralAIPlugin OpenRouterPlugin \
            OpenAICompatiblePlugin
          do
            ditto \
              "build-feature/Build/Products/Debug/$plugin.bundle" \
              "$staging/BranchBuiltPlugins/$plugin.bundle"
          done
          printf 'branch=%s\ncommit=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            > "$staging/$APP_NAME.app/Contents/Resources/FeatureBuildSource.txt"
          (cd "$staging" && ditto -c -k --sequesterRsrc . "$GITHUB_WORKSPACE/build-feature/$APP_NAME.zip")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}
          path: build-feature/${{ env.APP_NAME }}.zip
          retention-days: 14
